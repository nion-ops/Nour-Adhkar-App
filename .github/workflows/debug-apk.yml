name: Debug APK Build

on:
  push:
    branches: ['**']

permissions:
  contents: write

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Bazaar Debug APK
        run: ./gradlew assembleBazaarDebug -x lint --no-configuration-cache

      - name: Verify APK exists
        run: ls -la app/build/outputs/apk/bazaar/debug/app-bazaar-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Debug APK
          path: app/build/outputs/apk/bazaar/debug/app-bazaar-debug.apk
          retention-days: 7

      # Note: Only Bazaar debug variant is required for development (matches local `assembleBazaarDebug`).
      # Myket debug is optional and not built by this workflow per spec edge cases.
      # Debug signing uses Android's auto-generated debug keystore — no secrets, keystores,
      # or passwords required. The APK will be signed as `ir.adhkar.app.debug`.

      # Publish the debug APK to a rolling prerelease so it is downloadable from the Releases page.
      # Only from main: publishing every feature-branch push would spam releases with untested builds.
      - name: Publish debug APK to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view debug-latest >/dev/null 2>&1 \
            || gh release create debug-latest --prerelease \
                 --title "Debug Build (latest)" \
                 --notes "Latest debug APK built from main. Installs alongside the release app as ir.adhkar.app.debug."
          gh release upload debug-latest app/build/outputs/apk/bazaar/debug/app-bazaar-debug.apk --clobber